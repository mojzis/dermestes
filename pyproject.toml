[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "dermestes"
description = "Finds Python abstractions that have not earned their keep, and reports them as deletion candidates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mojzis", email = "mojzisek@gmail.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["python", "static-analysis", "refactoring", "over-abstraction", "linter", "rust"]
dynamic = ["version"]
dependencies = []

[project.urls]
homepage = "https://github.com/mojzis/dermestes"
repository = "https://github.com/mojzis/dermestes"
documentation = "https://mojzis.github.io/dermestes"

[tool.maturin]
bindings = "bin"
strip = true
