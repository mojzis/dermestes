[package]
name = "dermestes"
version = "0.1.0"
edition = "2021"
description = "Finds Python abstractions that have not earned their keep, and reports them as deletion candidates"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mojzis/dermestes"
keywords = ["python", "static-analysis", "refactoring", "linter", "cli"]
categories = ["development-tools", "command-line-utilities"]

# Each dependency carries a one-line justification (constitution, engineering rules).
[dependencies]
# CLI parsing; same as the sibling tools.
clap = { version = "4.6", features = ["derive", "color"] }
# Error context across I/O and parse boundaries.
anyhow = "1.0"
# Reads `[tool.dermestes]` from pyproject.toml.
toml = "1.1.4"

[dev-dependencies]
# Drive the real binary in tests/*.rs.
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.26"

[lib]
name = "dermestes"
path = "src/lib.rs"

[[bin]]
name = "dermestes"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Cherry-picked restriction lints
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"
clone_on_ref_ptr = "warn"
exit = "warn"
await_holding_lock = "warn"
large_futures = "warn"
allow_attributes_without_reason = "warn"
missing_assert_message = "warn"

# Cargo group allows
multiple_crate_versions = "allow"

# Pedantic allows (too noisy)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"

# Nursery allows (unstable/buggy lints)
missing_const_for_fn = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
future_not_send = "allow"
